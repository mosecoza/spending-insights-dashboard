services:
  dashboard:
    build:
      context: .
      target: development
    command: yarn dev --host 0.0.0.0
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    init: true

  production:
    profiles:
      - production
    build:
      context: .
      target: production
    ports:
      - '${DASHBOARD_PORT:-8080}:80'
    restart: unless-stopped
